<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      ;(() => {
        const params = new URLSearchParams(window.location.search)
        const path = params.get('p')
        if (!path) return

        const query = params.get('q')
        const nextUrl = `${window.location.pathname}${path}${query ? `?${query.replace(/~and~/g, '&')}` : ''}${window.location.hash}`
        window.history.replaceState(null, '', nextUrl)
      })()
    </script>
