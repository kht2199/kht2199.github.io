<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Redirecting…</title>
    <script>
      const pathSegmentsToKeep = 0
      const { pathname, search, hash } = window.location
      const redirect = window.location.protocol + '//' + window.location.hostname + (window.location.port ? ':' + window.location.port : '') +
        pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?p=/' +
        pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (search ? '&q=' + search.slice(1).replace(/&/g, '~and~') : '') +
        hash
      window.location.replace(redirect)
    </script>
  </head>
  <body></body>
</html>
